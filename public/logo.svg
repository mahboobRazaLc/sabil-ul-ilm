<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d4a35"/>
      <stop offset="100%" stop-color="#0a3525"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4a017"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f0e8"/>
      <stop offset="100%" stop-color="#e8dfd0"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="96" fill="url(#bg)"/>

  <!-- Subtle geometric ring -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="#d4a017" stroke-width="0.5" opacity="0.3"/>
  <circle cx="100" cy="100" r="82" fill="none" stroke="#d4a017" stroke-width="0.3" opacity="0.15"/>

  <!-- Crescent moon - subtle Islamic element -->
  <path d="M100 28 C112 28, 122 38, 122 50 C122 62, 112 72, 100 72 C108 68, 114 60, 114 50 C114 40, 108 32, 100 28Z" fill="url(#gold)" opacity="0.85"/>

  <!-- Small star -->
  <polygon points="100,22 102,27 107,27 103,30 104.5,35 100,32 95.5,35 97,30 93,27 98,27" fill="url(#gold)" opacity="0.7"/>

  <!-- Open Book -->
  <!-- Left page -->
  <path d="M100 105 L100 145 C100 145, 75 140, 55 135 C55 135, 55 105, 100 105Z" fill="url(#bookGrad)" opacity="0.95"/>
  <!-- Right page -->
  <path d="M100 105 L100 145 C100 145, 125 140, 145 135 C145 135, 145 105, 100 105Z" fill="#ffffff" opacity="0.9"/>
  <!-- Book spine -->
  <line x1="100" y1="103" x2="100" y2="147" stroke="#b8860b" stroke-width="1.5" opacity="0.6"/>
  <!-- Left page lines -->
  <line x1="68" y1="115" x2="95" y2="112" stroke="#0d4a35" stroke-width="0.8" opacity="0.15"/>
  <line x1="66" y1="120" x2="95" y2="117" stroke="#0d4a35" stroke-width="0.8" opacity="0.15"/>
  <line x1="64" y1="125" x2="95" y2="122" stroke="#0d4a35" stroke-width="0.8" opacity="0.15"/>
  <line x1="62" y1="130" x2="95" y2="127" stroke="#0d4a35" stroke-width="0.8" opacity="0.15"/>
  <!-- Right page lines -->
  <line x1="105" y1="112" x2="132" y2="115" stroke="#0d4a35" stroke-width="0.8" opacity="0.12"/>
  <line x1="105" y1="117" x2="134" y2="120" stroke="#0d4a35" stroke-width="0.8" opacity="0.12"/>
  <line x1="105" y1="122" x2="136" y2="125" stroke="#0d4a35" stroke-width="0.8" opacity="0.12"/>
  <line x1="105" y1="127" x2="138" y2="130" stroke="#0d4a35" stroke-width="0.8" opacity="0.12"/>

  <!-- Arabic text: سبیل العلم -->
  <text x="100" y="90" text-anchor="middle" font-family="'Noto Naskh Arabic', 'Amiri', 'Scheherazade New', serif" font-size="20" font-weight="700" fill="#ffffff" direction="rtl">سبیلُ العلم</text>

  <!-- Gold accent line -->
  <line x1="60" y1="97" x2="140" y2="97" stroke="url(#gold)" stroke-width="1" opacity="0.5"/>

  <!-- English text -->
  <text x="100" y="168" text-anchor="middle" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="3" fill="#d4a017" opacity="0.9">SABEEL-UL-ILM</text>

  <!-- Tagline -->
  <text x="100" y="182" text-anchor="middle" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="6.5" font-weight="500" letter-spacing="1.5" fill="#ffffff" opacity="0.45">DARS-E-NIZAMI</text>
</svg>
